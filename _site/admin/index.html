<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>ADC EDITORIAL DESK — Atlantic Democracy Center</title>
    <link rel="stylesheet" href="/admin/styles.css">
    <link rel="stylesheet" href="/admin/app.css">
  </head>
  <body>
    <div id="admin-app" class="admin-app">
      <aside class="sidebar" id="sidebar">
        <div class="brand-block">
          <img src="/assets/logo-header-navy.png" alt="ADC" />
          <div class="brand-text">
            <strong>ADC</strong>
            <small>EDITORIAL DESK</small>
          </div>
        </div>
        <nav class="menu">
          <button data-route="/" class="menu-item">▣ Panel</button>
          <button data-route="/news" class="menu-item">▤ Noticias</button>
          <button class="menu-item" disabled>✦ Ideas (Próximamente)</button>
          <button class="menu-item" disabled>◉ Voces (Próximamente)</button>
          <button class="menu-item" disabled>◫ Summit (Próximamente)</button>
        </nav>
        <div class="sidebar-footer">
          <button id="settings-btn" class="settings">⚙ Configuración</button>
          <p class="org">Atlantic Democracy Center<br/>Editorial Desk</p>
        </div>
      </aside>

      <div class="main-area">
        <header class="topbar">
          <button id="menu-toggle" class="menu-toggle">☰</button>
          <div class="topbar-title">ADC Editorial Desk</div>
          <div class="topbar-actions">
            <button id="new-article" class="primary">+ Nueva noticia</button>
          </div>
        </header>

        <main id="view" class="view">
          <!-- SPA content injected here -->
        </main>
      </div>
    </div>

    <script src="/admin/app.js" type="module"></script>
  </body>
</html>
