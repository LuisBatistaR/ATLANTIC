# Decap/Netlify CMS configuration template for Atlantic Democracy Center
# IMPORTANT: Replace placeholders (YOUR_GITHUB_USER/REPO) and configure OAuth as documented in ADMIN-SETUP.md

backend:
  name: github
  repo: "YOUR_GITHUB_USER/YOUR_REPO"
  branch: "main"
  # Do NOT commit client secrets. For GitHub OAuth you must register an OAuth App
  # and configure the Client ID where your hosting expects it. See ADMIN-SETUP.md

publish_mode: editorial_workflow

media_folder: "content-media"
public_folder: "/content-media"

site_url: "https://atlanticdemocracy.org"

collections:
  - name: "news"
    label: "Noticias"
    folder: "content/news"
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    fields:
      - { label: "Título", name: "title", widget: "string" }
      - { label: "Slug", name: "slug", widget: "string", hint: "URL safe, por ejemplo: mi-noticia" }
      - { label: "Fecha", name: "date", widget: "datetime" }
      - { label: "Autor", name: "author", widget: "string" }
      - { label: "Categoría", name: "category", widget: "select", options: ["Venezuela","Iberoamérica","España","Europa","Atlántico","Democracia","Libertad"] }
      - { label: "Imagen principal", name: "thumbnail", widget: "image" }
      - { label: "Extracto", name: "excerpt", widget: "text" }
      - { label: "Destacada", name: "featured", widget: "boolean", default: false }
      - { label: "Idioma", name: "lang", widget: "string", default: "es" }
      - { label: "Contenido", name: "body", widget: "markdown" }

  - name: "ideas"
    label: "Ideas"
    folder: "content/ideas"
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    fields:
      - { label: "Título", name: "title", widget: "string" }
      - { label: "Slug", name: "slug", widget: "string" }
      - { label: "Fecha", name: "date", widget: "datetime" }
      - { label: "Autor", name: "author", widget: "string" }
      - { label: "Tipo", name: "type", widget: "select", options: ["Artículo","Ensayo","Análisis","Opinión","Investigación"] }
      - { label: "Imagen principal", name: "thumbnail", widget: "image" }
      - { label: "Extracto", name: "excerpt", widget: "text" }
      - { label: "Destacada", name: "featured", widget: "boolean", default: false }
      - { label: "Idioma", name: "lang", widget: "string", default: "es" }
      - { label: "Contenido", name: "body", widget: "markdown" }

  - name: "voices"
    label: "Voces"
    folder: "content/voices"
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    fields:
      - { label: "Título", name: "title", widget: "string" }
      - { label: "Slug", name: "slug", widget: "string" }
      - { label: "Fecha", name: "date", widget: "datetime" }
      - { label: "Autor / Creador", name: "author", widget: "string" }
      - { label: "Tipo de contenido", name: "kind", widget: "select", options: ["Reel","Vídeo","Entrevista","Conversación"] }
      - { label: "Thumbnail / Imagen", name: "thumbnail", widget: "image" }
      - { label: "URL del vídeo", name: "video_url", widget: "string", required: false }
      - { label: "Duración", name: "duration", widget: "string", required: false }
      - { label: "Extracto", name: "excerpt", widget: "text" }
      - { label: "Contenido (opcional)", name: "body", widget: "markdown", required: false }
      - { label: "Destacada", name: "featured", widget: "boolean", default: false }
      - { label: "Idioma", name: "lang", widget: "string", default: "es" }

  - name: "initiatives"
    label: "Iniciativas"
    folder: "content/initiatives"
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "Título", name: "title", widget: "string" }
      - { label: "Slug", name: "slug", widget: "string" }
      - { label: "Descripción corta", name: "summary", widget: "text" }
      - { label: "Imagen", name: "thumbnail", widget: "image" }
      - { label: "Contenido", name: "body", widget: "markdown" }
      - { label: "Destacada", name: "featured", widget: "boolean", default: false }
      - { label: "Estado", name: "status", widget: "select", options: ["draft","published"] }

  - name: "summit"
    label: "Summit"
    folder: "content/summit"
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "Edición", name: "edition", widget: "string" }
      - { label: "Título", name: "title", widget: "string" }
      - { label: "Fecha", name: "date", widget: "datetime" }
      - { label: "Lugar", name: "place", widget: "string" }
      - { label: "Imagen", name: "thumbnail", widget: "image" }
      - { label: "Descripción corta", name: "summary", widget: "text" }
      - { label: "Contenido", name: "body", widget: "markdown" }
      - { label: "Destacada", name: "featured", widget: "boolean", default: false }
